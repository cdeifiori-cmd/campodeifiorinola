  var b = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };

  function apri(chiave) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b(P.iv) }, chiave, b(P.dati)).then(function (buf) {
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    }).then(function (html) { document.open(); document.write(html); document.close(); });
  }
  function chiaveDa(password) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]).then(function (k) {

  }

  try {

  } catch (e) {}

    var chiave;
