<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La bussola del gruppo – Robinson</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <meta name="theme-color" content="#1a3a5c">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/robinson.css">
  <style>
    body { padding-bottom: 90px; }

    .cons-header {
      background: linear-gradient(135deg, var(--navy) 0%, #0d1b2a 100%);
      color: #fff;
      padding: 22px 18px 18px;
      text-align: center;
    }
    .cons-header h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--oro-light); }
    .cons-header .sub { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; font-style: italic; }

    #nav-auth-slot-wrap { position: fixed; top: 10px; right: 10px; z-index: 300; }

    .cons-content { max-width: 620px; margin: 0 auto; padding: 18px 14px 24px; }

    .intro-box { background: var(--post-bg); border-left: 4px solid var(--oro); border-radius: 4px 12px 12px 4px; padding: 16px 18px; font-size: 0.92rem; line-height: 1.6; }
    .intro-box .firma { text-align:right; font-style: italic; color: var(--muted); margin-top:10px; font-size: 0.82rem; }
    .btn-inizia { display:block; margin: 18px auto 0; }

    .step-progress { display:flex; gap:6px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
    .step-dot { width:9px; height:9px; border-radius:50%; background: var(--carta-scura); }
    .step-dot.done { background: var(--oro); }
    .step-dot.current { background: var(--navy); }

    .domanda-box { text-align:center; margin-bottom: 14px; }
    .domanda-categoria { font-size: 0.78rem; color: var(--oro); font-weight: 700; letter-spacing: 0.4px; }
    .domanda-testo { font-family:'Playfair Display', serif; font-size: 1.08rem; color: var(--navy); margin-top: 6px; line-height: 1.4; }
    .domanda-hint { font-size: 0.76rem; color: var(--muted); margin-top: 6px; }

    .search-mini { margin: 10px 0; }
    .search-mini input { width:100%; padding:8px 12px; border:1.5px solid #c8b89a; border-radius:8px; font-family:'Lora',serif; font-size:0.85rem; background:#fff; }

    .grid-selezione { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:10px; max-height: 40vh; overflow-y:auto; padding: 4px 2px; }
    @media (min-width: 500px) { .grid-selezione { grid-template-columns: repeat(4, 1fr); } }
    .sel-card { text-align:center; cursor:pointer; border-radius: 10px; padding: 6px 4px; border: 2px solid transparent; transition: all 0.15s; }
    .sel-card.selected { border-color: var(--oro); background: var(--oro-light); }
    .sel-card .sc-foto { width: 100%; aspect-ratio:1/1; border-radius: 50%; overflow:hidden; background: var(--carta-scura); display:flex; align-items:center; justify-content:center; font-size:1.6rem; }
    .sel-card .sc-foto img { width:100%; height:100%; object-fit:cover; }
    .sel-card .sc-nome { font-size: 0.68rem; margin-top: 4px; color: var(--inchiostro); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sel-card.disabled { opacity: 0.35; cursor: not-allowed; }

    .perche-box { margin-top: 14px; }
    .perche-label { display:block; font-size: 0.82rem; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .perche-box textarea { width: 100%; box-sizing: border-box; min-height: 70px; padding: 10px 12px; border: 1.5px solid #c8b89a; border-radius: 10px; font-family: 'Lora', serif; font-size: 0.9rem; resize: vertical; background:#fff; }

    .step-nav { display:flex; gap:10px; justify-content:space-between; margin-top:18px; }
    .step-nav button { flex:1; }
    .contatore-sel { text-align:center; font-size: 0.78rem; color: var(--muted); margin-top: 6px; }

    .podio-riepilogo { background: var(--post-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .podio-riepilogo-titolo { font-family:'Playfair Display', serif; font-size: 0.95rem; color: var(--navy); margin-bottom: 8px; }
    .podio-riepilogo-item { display:flex; flex-wrap:wrap; align-items:baseline; gap: 6px 10px; padding: 5px 0; border-top: 1px dashed var(--carta-scura); }
    .podio-riepilogo-item:first-of-type { border-top: none; }
    .pr-pos { font-size: 0.95rem; }
    .pr-nome { font-weight: 700; color: var(--navy); font-size: 0.88rem; }
    .pr-perche { font-size: 0.8rem; color: var(--muted); font-style: italic; flex-basis: 100%; }

    .msg-attesa { text-align:center; padding: 30px 16px; color: var(--muted); font-style: italic; line-height: 1.6; }

    .errore-salvataggio { background:#fdecea; border:1.5px solid var(--rosso); color:#7a2015; border-radius:8px; padding:10px 14px; font-size:0.82rem; margin-top:12px; line-height:1.5; }
  </style>
</head>
<body>

<div id="nav-auth-slot-wrap"><div id="nav-auth-slot"></div></div>

<div class="cons-header">
  <h1>🧭 La bussola del gruppo</h1>
  <div class="sub">Ci aiuti a capire come vede l'isola la ciurma: le tue risposte restano riservate.</div>
</div>

<div class="cons-content" id="main-content">
  <div class="spinner"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
  <a href="villaggio.html" class="nav-item"><span class="nav-icon">🏡</span><span>Villaggio</span></a>
  <a href="spiaggia.html" class="nav-item"><span class="nav-icon">🏖️</span><span>Spiaggia</span></a>
  <a href="isola.html" class="nav-item"><span class="nav-icon">🏝️</span><span>Isola</span></a>
  <a href="attivita.html" class="nav-item active"><span class="nav-icon">🧭</span><span>Attività</span></a>
  <a href="naufraghi.html" class="nav-item"><span class="nav-icon">🧍</span><span>Naufraghi</span></a>
</nav>

<script type="module">
import { db } from './js/robinson-firebase.js';
import { requireAuth } from './js/robinson-auth.js';
import { setupNavAuth } from './js/robinson-nav.js';
import { esc, getFotoRobinson, caricaMappaUidCanonico, uidCanonico } from './js/robinson-utils.js';
import {
  collection, getDocs, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

setupNavAuth('nav-auth-slot');

const params = new URLSearchParams(location.search);
const ATT_ID = params.get('attId');

// Tre domande a podio (1°/2°/3° posto), stessa struttura per ciascuna: una persona + "Perché?".
const DOMANDE = [
  { chiave: 'migliori', emoji: '🌟', titolo: 'I migliori del campo',
    domanda: 'Chi sono, secondo te, i migliori del campo?',
    placeholderPerche: 'Perché aiuta sempre gli altri / perché è simpatico-a / perché è leale...' },
  { chiave: 'peggiori', emoji: '⚠️', titolo: 'I peggiori del campo',
    domanda: 'Chi sono, secondo te, i peggiori del campo?',
    placeholderPerche: 'Perché litiga sempre / perché comanda gli altri / perché non rispetta le regole...' },
  { chiave: 'puoMigliorare', emoji: '🌱', titolo: 'Chi potrebbe migliorare',
    domanda: 'Chi potrebbe migliorare di più, secondo te?',
    placeholderPerche: 'Perché a volte si arrabbia troppo / perché potrebbe ascoltare di più...' },
];
const POSIZIONI = [
  { emoji: '🥇', label: '1° posto' },
  { emoji: '🥈', label: '2° posto' },
  { emoji: '🥉', label: '3° posto' },
];

let allNaufraghi = [];
let mappaUidCanonico = {};
let currentUser = null;
let att = null;
let step = -1; // -1 = intro, 0..8 = domanda*3+posizione, 9 = riepilogo
let risposte = { migliori: [null, null, null], peggiori: [null, null, null], puoMigliorare: [null, null, null] };

requireAuth(async user => {
  currentUser = user;
  await avviaPagina();
});

async function avviaPagina() {
  const main = document.getElementById('main-content');
  if (!ATT_ID) {
    main.innerHTML = `<div class="msg-attesa">🧭 Attività non trovata.</div>`;
    return;
  }
  const attSnap = await getDoc(doc(db, 'attivita', ATT_ID));
  if (!attSnap.exists()) {
    main.innerHTML = `<div class="msg-attesa">🧭 Attività non trovata.</div>`;
    return;
  }
  att = { id: attSnap.id, ...attSnap.data() };

  if (att.stato === 'svolta') {
    main.innerHTML = `<div class="msg-attesa">🧭 La bussola del gruppo si è fermata: il questionario è concluso.<br>Grazie per aver partecipato!</div>`;
    return;
  }
  if (att.stato !== 'attiva') {
    main.innerHTML = `<div class="msg-attesa">🧭 La bussola del gruppo non è ancora pronta.<br>Torna presto.</div>`;
    return;
  }

  mappaUidCanonico = await caricaMappaUidCanonico();
  await caricaNaufraghi();

  const rispostaSnap = await getDoc(doc(db, 'robinson_questionario_campo', currentUser.uid));
  if (rispostaSnap.exists()) {
    const d = rispostaSnap.data();
    if (d.bloccata) {
      renderBloccato(d);
      return;
    }
    // Canonicalizza gli uid già salvati: potrebbero risalire a prima del fix dedup.
    const canonEntry = e => (e && e.uid) ? { uid: uidCanonico(mappaUidCanonico, e.uid), perche: e.perche || '' } : null;
    const canonArr = arr => {
      const out = (arr || []).map(canonEntry);
      while (out.length < 3) out.push(null);
      return out.slice(0, 3);
    };
    risposte = {
      migliori: canonArr(d.migliori),
      peggiori: canonArr(d.peggiori),
      puoMigliorare: canonArr(d.puoMigliorare),
    };
  }
  renderIntro();
}

// Deduplica per authUid reale (vedi robinson-utils.js): admin-pin.html copia il profilo
// naufrago su un nuovo docId quando crea il PIN, lasciando spesso vivo il vecchio docId.
async function caricaNaufraghi() {
  const snap = await getDocs(collection(db, 'robinson_naufraghi'));
  const seenAuth = new Set();
  const base = [];
  snap.docs.forEach(d => {
    const authUid = uidCanonico(mappaUidCanonico, d.id);
    if (authUid === currentUser.uid) return; // esclusione di sé
    const data = d.data();
    if (!data.nome) return;
    if (seenAuth.has(authUid)) return;
    seenAuth.add(authUid);
    base.push({ docId: d.id, uid: authUid, nome: data.nome, fotoDiretta: data.fotoRobinson || data.fotoProfilo || '' });
  });
  const entries = await Promise.all(base.map(async b => ({
    uid: b.uid, nome: b.nome, foto: b.fotoDiretta || await getFotoRobinson(b.docId) || '',
  })));
  allNaufraghi = entries.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
}

function nomeDi(uid) { return allNaufraghi.find(n => n.uid === uid)?.nome || uid; }

function contaCompletati() {
  let n = 0;
  DOMANDE.forEach(d => risposte[d.chiave].forEach(e => { if (e && e.uid && e.perche && e.perche.trim()) n++; }));
  return n;
}

function primoStepIncompleto() {
  for (let dIdx = 0; dIdx < 3; dIdx++) {
    for (let pIdx = 0; pIdx < 3; pIdx++) {
      const e = risposte[DOMANDE[dIdx].chiave][pIdx];
      if (!e || !e.uid || !e.perche || !e.perche.trim()) return dIdx * 3 + pIdx;
    }
  }
  return 9;
}

// ── Naufrago bloccato dall'admin: sola lettura, nessuna modifica possibile ─────────────────
function renderBloccato(d) {
  document.getElementById('main-content').innerHTML = `
    <div class="msg-attesa">🔒 Le tue risposte alla bussola del gruppo sono state chiuse dalla Ciurma educativa.<br>Grazie per aver partecipato!</div>
  `;
}

// ── Intro ────────────────────────────────────────────────────────────────
function renderIntro() {
  const completati = contaCompletati();
  const giaCompilato = completati > 0;
  const completo = completati === 9;
  document.getElementById('main-content').innerHTML = `
    <div class="intro-box">
      "Ogni naufrago vede l'isola a modo suo. Con questa bussola ci aiuti a capire come la vede la ciurma:
      chi si distingue in positivo, chi fa più fatica, chi potrebbe crescere. Non esistono risposte giuste o sbagliate,
      solo il tuo punto di vista."
      <div class="firma">— La Bussola del Gruppo</div>
    </div>
    <button class="btn btn-primary btn-inizia" id="btn-inizia">${giaCompilato ? (completo ? '✏️ Rivedi le tue risposte' : '▶️ Continua da dove avevi lasciato') : '🧭 Inizia'}</button>
    ${giaCompilato ? `<div style="text-align:center;margin-top:8px;font-size:0.78rem;color:var(--muted);">${completo ? 'Hai già completato il questionario: puoi ancora modificare le tue risposte.' : `Hai completato ${completati} risposte su 9.`}</div>` : ''}
  `;
  document.getElementById('btn-inizia').addEventListener('click', () => {
    step = primoStepIncompleto();
    renderStep();
  });
}

// ── Step podio (una posizione alla volta: persona + perché) ────────────────────────────────
function renderProgress(current) {
  let html = '<div class="step-progress">';
  for (let i = 0; i < 9; i++) {
    html += `<div class="step-dot ${i < current ? 'done' : i === current ? 'current' : ''}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderStep() {
  if (step >= 9) { renderRiepilogo(); return; }
  const dIdx = Math.floor(step / 3), pIdx = step % 3;
  const d = DOMANDE[dIdx], pos = POSIZIONI[pIdx];
  // No doppioni nel podio: le persone già scelte per un'altra posizione di QUESTA domanda
  // sono disabilitate (ma restano visibili, così è chiaro perché non si possono ritoccare).
  const usatiInQuestaDomanda = new Set(
    risposte[d.chiave].filter((e, i) => i !== pIdx && e && e.uid).map(e => e.uid)
  );
  const attuale = risposte[d.chiave][pIdx] || { uid: null, perche: '' };

  const main = document.getElementById('main-content');
  main.innerHTML = `
    ${renderProgress(step)}
    <div class="domanda-box">
      <div class="domanda-categoria">${d.emoji} ${esc(d.titolo)} — ${pos.emoji} ${esc(pos.label)}</div>
      <div class="domanda-testo">${esc(d.domanda)}</div>
      <div class="domanda-hint">Tocca una persona dall'elenco.</div>
    </div>
    <div class="search-mini"><input type="text" id="search-inp" placeholder="🔍 Cerca per nome..."></div>
    <div class="grid-selezione" id="grid-sel"></div>
    <div class="perche-box" id="perche-box" style="display:${attuale.uid ? 'block' : 'none'};">
      <label class="perche-label" for="perche-inp">Perché?</label>
      <textarea id="perche-inp" maxlength="200" placeholder="${esc(d.placeholderPerche)}">${esc(attuale.perche || '')}</textarea>
    </div>
    <div id="errore-salvataggio" class="errore-salvataggio" style="display:none;"></div>
    <div class="step-nav">
      <button class="btn" style="background:var(--carta-scura);" id="btn-indietro">← Indietro</button>
      <button class="btn btn-primary" id="btn-avanti" disabled>${step < 8 ? 'Avanti →' : 'Rivedi le tue risposte →'}</button>
    </div>
  `;

  let uidScelto = attuale.uid;

  function aggiornaAvanti() {
    const perche = document.getElementById('perche-inp').value.trim();
    document.getElementById('btn-avanti').disabled = !(uidScelto && perche.length > 0);
  }

  function renderGrid(filtro = '') {
    const grid = document.getElementById('grid-sel');
    const lista = allNaufraghi.filter(n => n.nome.toLowerCase().includes(filtro.toLowerCase()));
    grid.innerHTML = lista.map(n => {
      const isSel = n.uid === uidScelto;
      const disabled = !isSel && usatiInQuestaDomanda.has(n.uid);
      return `<div class="sel-card ${isSel ? 'selected' : ''} ${disabled ? 'disabled' : ''}" data-uid="${esc(n.uid)}">
        <div class="sc-foto">${n.foto ? `<img src="${esc(n.foto)}" alt="${esc(n.nome)}" loading="lazy">` : '⚓'}</div>
        <div class="sc-nome">${esc(n.nome)}</div>
      </div>`;
    }).join('') || '<div class="empty-msg" style="grid-column:1/-1;">Nessun naufrago trovato.</div>';

    grid.querySelectorAll('.sel-card:not(.disabled)').forEach(card => {
      card.addEventListener('click', () => {
        uidScelto = card.dataset.uid;
        renderGrid(document.getElementById('search-inp').value);
        document.getElementById('perche-box').style.display = 'block';
        aggiornaAvanti();
      });
    });
  }

  renderGrid();
  document.getElementById('search-inp').addEventListener('input', e => renderGrid(e.target.value));
  document.getElementById('perche-inp').addEventListener('input', aggiornaAvanti);
  aggiornaAvanti();

  document.getElementById('btn-indietro').addEventListener('click', () => {
    step--;
    if (step < 0) renderIntro(); else renderStep();
  });
  document.getElementById('btn-avanti').addEventListener('click', () => {
    risposte[d.chiave][pIdx] = { uid: uidScelto, perche: document.getElementById('perche-inp').value.trim() };
    step++;
    renderStep();
  });
}

// ── Riepilogo + conferma ───────────────────────────────────────────────────
function renderRiepilogo() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="domanda-box">
      <div class="domanda-testo">Le tue risposte</div>
      <div class="domanda-hint">Controlla e conferma, oppure torna indietro per modificare.</div>
    </div>
    ${DOMANDE.map(d => `
      <div class="podio-riepilogo">
        <div class="podio-riepilogo-titolo">${d.emoji} ${esc(d.titolo)}</div>
        ${POSIZIONI.map((pos, i) => {
          const e = risposte[d.chiave][i];
          return `<div class="podio-riepilogo-item">
            <span class="pr-pos">${pos.emoji}</span>
            <span class="pr-nome">${e && e.uid ? esc(nomeDi(e.uid)) : '—'}</span>
            ${e && e.perche ? `<span class="pr-perche">"${esc(e.perche)}"</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    `).join('')}
    <div id="errore-salvataggio" class="errore-salvataggio" style="display:none;"></div>
    <div class="step-nav">
      <button class="btn" style="background:var(--carta-scura);" id="btn-indietro">← Modifica</button>
      <button class="btn btn-primary" id="btn-conferma">🧭 Affida le tue risposte alla Bussola</button>
    </div>
  `;
  document.getElementById('btn-indietro').addEventListener('click', () => { step = 8; renderStep(); });
  document.getElementById('btn-conferma').addEventListener('click', salvaRisposte);
}

async function salvaRisposte() {
  const btn = document.getElementById('btn-conferma');
  btn.disabled = true; btn.textContent = 'Salvataggio...';
  mostraErroreSalvataggio('');
  const TIMEOUT_MS = 20000;
  let timeoutId;
  try {
    const rifDoc = doc(db, 'robinson_questionario_campo', currentUser.uid);
    const dati = {
      uid: currentUser.uid,
      attId: ATT_ID,
      migliori: risposte.migliori,
      peggiori: risposte.peggiori,
      puoMigliorare: risposte.puoMigliorare,
      timestamp: serverTimestamp(),
    };
    // setDoc() su connessione assente/instabile puo' restare "pending" indefinitamente: senza
    // un limite l'utente vede "Salvataggio..." bloccato a oltranza e puo' abbandonare la pagina
    // pensando sia riuscito, perdendo la scrittura senza che venga mai mostrato un errore.
    const timeout = new Promise((_, reject) => {
      timeoutId = setTimeout(() => reject(new Error('Tempo scaduto: verifica la connessione e riprova.')), TIMEOUT_MS);
    });
    await Promise.race([setDoc(rifDoc, dati), timeout]);
    clearTimeout(timeoutId);

    // Verifica lettura-dopo-scrittura: rilegge il documento per confermare che sia
    // REALMENTE presente sul server prima di mostrare l'esito positivo.
    const verifica = await getDoc(rifDoc);
    if (!verifica.exists() || !verifica.data().timestamp) {
      throw new Error('Il salvataggio non risulta confermato sul server.');
    }

    document.getElementById('main-content').innerHTML = `<div class="msg-attesa">🧭 Le tue risposte sono state affidate alla Bussola del Gruppo.<br>Grazie per aver partecipato!<br><br>
      <button class="btn btn-primary" id="btn-torna-attivita">Torna alle Attività</button></div>`;
    document.getElementById('btn-torna-attivita').addEventListener('click', () => location.href = 'attivita.html');
  } catch (e) {
    clearTimeout(timeoutId);
    console.error('[bussola-gruppo] Salvataggio risposte fallito:', e);
    mostraErroreSalvataggio(`⚠️ Salvataggio non riuscito: ${e.message || e}. Controlla la connessione e riprova — le tue risposte restano qui, non hai perso nulla.`);
    btn.disabled = false; btn.textContent = '🧭 Affida le tue risposte alla Bussola';
  }
}

// Banner d'errore persistente (non un alert(), facile da perdere/bloccare su mobile e WebView
// in-app): resta visibile finche' l'utente non riprova con successo o torna indietro.
function mostraErroreSalvataggio(messaggio) {
  const el = document.getElementById('errore-salvataggio');
  if (!el) return;
  if (!messaggio) { el.style.display = 'none'; el.textContent = ''; return; }
  el.textContent = messaggio;
  el.style.display = 'block';
}
</script>
</body>
</html>
