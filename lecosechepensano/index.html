<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le cose che pensano · Campo dei Fiori</title>
<meta name="description" content="Le cose che pensano: dall'usa e getta all'usa e riusa. Il video del progetto di Campo dei Fiori a Nola.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
<style>
  :root{--carta:#efe6d2;--inchiostro:#17140f;--rosso:#c8261d;--verde:#1f5a3a;--oro:#e2a92b;--blu:#1d3f78}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:"Special Elite","Courier New",monospace;color:var(--inchiostro);
    background:
      linear-gradient(172deg,transparent 0 22%,rgba(29,63,120,.9) 22% 31%,transparent 31%),
      linear-gradient(-8deg,transparent 0 64%,rgba(200,38,29,.88) 64% 72%,transparent 72%),
      linear-gradient(3deg,transparent 0 84%,rgba(226,169,43,.9) 84% 92%,transparent 92%),
      #2a2520;
    background-attachment:fixed}
  main{display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:28px 48px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rt{position:relative;isolation:isolate}
  .rt::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);filter:url(#strappo);box-shadow:var(--ombra,4px 5px 0 rgba(0,0,0,.4))}
  h1{display:flex;flex-wrap:wrap;justify-content:center;gap:.12em .3em;font-weight:400;text-align:center;font-size:clamp(2.2rem,8vw,4.6rem);line-height:.9}
  h1 span{display:inline-block;padding:.08em .22em .04em}
  h1 span:nth-child(1){font-family:"Anton";text-transform:uppercase;--bg:var(--carta);rotate:-2deg}
  h1 span:nth-child(2){font-family:"Playfair Display";font-style:italic;font-weight:900;--bg:var(--rosso);color:var(--carta);rotate:2deg}
  h1 span:nth-child(3){font-family:"Anton";text-transform:uppercase;--bg:var(--blu);color:var(--carta);rotate:-1deg}
  .motto{--bg:var(--oro);padding:.5em 1.1em;font-size:clamp(1rem,2.4vw,1.25rem);rotate:-1deg;text-align:center}
  .cornice{--bg:var(--carta);padding:14px;width:min(420px,100%);rotate:.8deg}
  video{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#111}
  .nota{color:var(--carta);text-align:center;max-width:36ch;font-size:.95rem;line-height:1.5}
  .torna{--bg:var(--inchiostro);color:var(--carta);text-decoration:none;padding:.6em 1.1em;font-family:"Anton";text-transform:uppercase;letter-spacing:.03em}
  .torna.in-alto{align-self:flex-start;font-size:.95rem;rotate:-1.5deg}
  .torna:focus-visible{outline:3px solid var(--oro);outline-offset:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="strappo" x="-5%" y="-10%" width="110%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="3" result="r"/>
    <feDisplacementMap in="SourceGraphic" in2="r" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main>
  <a class="torna rt in-alto" href="/camponatale/">← Torna a Campo Natale</a>
  <h1 aria-label="Le cose che pensano"><span class="rt">Le cose</span><span class="rt">che</span><span class="rt">pensano</span></h1>
  <p class="motto rt">Dall'usa e getta all'usa e riusa</p>
  <div class="cornice rt">
    <video controls playsinline preload="metadata" poster="copertina.jpg">
      <source src="le-cose-che-pensano.mp4" type="video/mp4">
      Il tuo browser non riesce a mostrare il video: <a href="le-cose-che-pensano.mp4">scaricalo qui</a>.
    </video>
  </div>
  <p class="nota">Un progetto di Campo dei Fiori a Nola. Prima di comprare, pensa. Prima di buttare, riusa, ripara, crea!</p>
  <a class="torna rt" href="/camponatale/">← Torna a Campo Natale</a>
</main>
</body>
</html>
