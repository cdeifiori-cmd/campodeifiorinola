document.getElementById("accesso").onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"), btn = document.getElementById("entra");
  btn.disabled = true; err.style.color = "#61666d"; err.textContent = "Verifica in corso…";
  try {
    const b = Uint8Array.from(atob(DATI), (c) => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b.slice(0, 16), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(16, 28) }, k, b.slice(28)));
    document.open(); document.write(html); document.close();
  } catch (x) {
    btn.disabled = false; err.style.color = "#b02a2a"; err.textContent = "Password errata."; document.getElementById("pw").select();
  }
};
